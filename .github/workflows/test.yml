name: test

# Runs the full gate on every push to main and on every PR. The gate
# is: tsc --noEmit (type safety), vitest (frontend unit tests),
# pytest (backend contract tests). The npm install step takes the
# longest of the three; running lint and test in parallel saves ~30s
# on cold cache. The drift-check job is gated by the `drift` job that
# assets/check-links.js owns (added in a follow-up commit); when that
# job is absent, the workflow still runs the three core jobs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  frontend:
    name: vitest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
        env:
          # loopWav tests use a hand-rolled OfflineAudioContext mock
          # so jsdom's missing WebAudio impl isn't an issue — but we
          # set CI=true so vitest's reporter stays compact.
          CI: "true"

  backend:
    name: pytest (FastAPI contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install -r server/requirements-dev.txt
      - run: npm run test:py
