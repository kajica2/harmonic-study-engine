active_prevention_rules:
  - id: "PM-2026-009-001"
    when: "Introducing a new optional config / UI chip with a persisted default"
    action: "Default the new param so callers without the explicit prop still work; gate the visual behind the param being non-empty/non-null so the chip's status dot is never mis-colored."
  - id: "PM-2026-009-002"
    when: "Mocking a previously-unmocked module in a hook test"
    action: "Use vi.mock at the top of the file (before the import that captures the module) so the module-level singleton lands on the stub; provide a __setStub-setter hook for per-test swaps."
  - id: "PM-2026-009-003"
    when: "Augmenting a callback signature with a new optional arg"
    action: "Keep existing callers working (the extra arg is ignored); update the listener type signature to reflect the new shape, not just the implementation."
  - id: "PM-2026-009-004"
    when: "Authoring feature code on this repo"
    action: "Run grep for non-ASCII bytes (e2 80 9x, c2 b7, e2 99 aa, etc.) on the diff; replace em-dash with hyphen and middle-dot with ASCII separator before committing. Pre-existing non-ASCII in the codebase is NOT yours to fix unless asked."
  - id: "PM-2026-009-005"
    when: "Adding a wrapper aria-label around a chip that already has a labeled control inside"
    action: "Drop the wrapper aria-label - the inner control's label is the single source of truth and screen readers would announce the chip name twice."
  - id: "PM-2026-009-006"
    when: "Setting outline-none on a focusable element (Tailwind)"
    action: "Pair it with a focus-visible replacement ring/border. The three toolbar selects (IN / OUT / BASS CH) all need focus-visible:ring-1 focus-visible:ring-neutral-400/60."
  - id: "PM-2026-022-001"
    when: "Cross-referencing the PRD against existing planning docs"
    action: "PRD-001 (docs/PRD-001.md) is the strategic source of truth. Add a 'PRD-001 alignment' section to FUTURE_PLANNING.md mapping each PRD phase to current state instead of duplicating phase docs."
  - id: "ADR-003-01"
    when: "Editing any engine/** non-test source"
    action: "No external imports (allowlist guard in engine/purity.test.ts), no Math.random/Date.now/new Date/performance.now/require/console. Timestamps flow in as parameters. See .kai/decisions/ADR-003-engine-layout-and-purity-guard.md."
  - id: "ADR-003-02"
    when: "Adding tests for engine code"
    action: "Colocate under engine/**/*.test.ts (node env). NEVER add files to tests/ - the check-links drift gate counts tests/*.test.ts only and README counts would go red."
  - id: "ADR-005-01"
    when: "Implementing Phase 3+ generators"
    action: "Thread (seed, constraints) into deriveCanonicalId for determinism (REQ-ETU-15); pass nowMs from the adapter layer - engine never reads the clock."
  - id: "W2-001"
    when: "Adjudicating 'declared model vs actual data' premises (e.g. step=beat vs step=bar)"
    action: "Run data forensics FIRST (parse real data: descriptions, repeat structure, ingest script intent). Doc comments and planning docs can be fiction - the paths.ts '1 step = 1 beat' claim nearly justified a transport change that would have played the entire masterclass catalog 4x too fast."
  - id: "W2-002"
    when: "Any agent reverting mutations in a worktree where parallel agents may be writing"
    action: "NEVER use git checkout --/reset to restore files (it reverts to HEAD and destroys uncommitted parallel work - it happened: tester wiped docs' CHANGELOG edit). Restore from per-file copy snapshots taken at intake; verify with shasum."
  - id: "PHASE-1-01"
    when: "Adding keyboard shortcuts to a global handler"
    action: "Guard against metaKey/ctrlKey/altKey BEFORE the key branches to avoid stealing browser-native tab-switch (Cmd/Ctrl+1..9), Spotlight (Cmd+Space), menu mnemonics (Alt+letter), and window-minimize (Cmd+M). Shift is usually fine to allow. Pin the guard with a test that exercises the modifier combination."
  - id: "PHASE-1-02"
    when: "Shipping an affordance (button, chip, action) the design calls for"
    action: "Wire it on day 1 - either functional or a visible disabled placeholder with an honest title/tooltip explaining what is missing. A `disabled` button with no onClick and no discoverability hint is a regression: review failed it twice in one phase. Phase 1 specific: the IdeaBar `+` button - disabled with title='No chord yet' when no activeStep."
  - id: "PHASE-2-01"
    when: "Implementing any component that picks UI from store/session state (gates, routers, conditional surfaces)"
    action: "Subscribe to the state - mount-time-only resolution makes switching cosmetic (the Phase 1 ModeGate bug shipped past review+tests this way). URL/boot-time inputs read ONCE; live state drives live render. Regression tests MUST mutate state AFTER mount and assert the UI switched; mount-with-preseeded-state tests cannot catch this class."
  - id: "PHASE-2-02"
    when: "Taking intake snapshots for mutation/revert safety (W2-002)"
    action: "Snapshot folders are per-ROUND, never reused across rounds - /tmp/phase-2-snapshots/ went STALE mid-session (Phase 1 baseline) and restoring from it would have destroyed Phase 2 work. Fresh copies to a new dated folder before each round's first edit; never restore from a folder you did not create this round."
  - id: "PHASE-3-01"
    when: "Implementing any pattern detector / truthfulness claim (annotations, analyzers, classifiers)"
    action: "Every detector needs a NEGATIVE fixture that differs ONLY in the claimed property (ii-V-iii vs ii-V-I, identical prefix). Adjacency-shaped positives alone let weakened detectors silently survive the suite - proven by mutation test in Phase 3 slice 1."
  - id: "PHASE-3-02"
    when: "Shipping a static feasibility/validation check next to a randomized generator"
    action: "The check must be conservative-sound (may over-warn, must never claim feasible-then-throw) and pinned by a property sweep (>=300 seeds x shape matrix) plus an audit of EVERY throw site in the generator. A static mirror of a data-dependent pass sequence lies - Phase 3 fix round item 3."
  - id: "PHASE-3-03"
    when: "A mount-once effect queues state updates that are not idempotent (index shifts, appends, counters)"
    action: "Guard with a useRef one-shot (refs survive StrictMode remount) or make every setter a pure function of the same snapshot. A dedupe guard on ONE piece of state (prev.some) does NOT protect a second setter (setActivePathIndex(i=>i+1)) - MED-NEW-001 shipped past review+gates because dev-mode double-invoke is invisible to prod-built tests."
  - id: "PHASE-3-04"
    when: "Wiring a new consumer to index math over generated data"
    action: "Re-derive the units convention (steps vs bars) from the PRODUCER, never inherit formulas from a spec doc that may contradict its own audit findings - the docs agent caught the activeBar divide-by-4 bug that code review missed because docs read the code line-by-line."
