# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Imports this repository and provisions:
#   - DDSP FastAPI backend (Python web service)
#   - Optional disk for any future model artifacts
#
# To deploy: connect https://github.com/kajica2/harmonic-study-engine
# to Render and select "Blueprint" → render.yaml.

services:
  - type: web
    name: harmonic-study-engine-api
    runtime: docker
    plan: starter          # free tier
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerContext: ../
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10
      - key: PORT
        value: 8765
      - key: DDSP_HOST
        value: 0.0.0.0
      # CORS for the Vercel-deployed frontend. Frontend reads
      # https://harmonic-study-engine.vercel.app by default, but you can
      # also add preview domains later; the wildcard covers prerender subdomains.
      - key: DDSP_CORS_ORIGINS
        value: "https://harmonic-study-engine.vercel.app,https://harmonic-study-engine-git-*.vercel.app,http://localhost:3000"

# Note about scale:
#   - Render free plan sleeps after 15 min of inactivity, so
#     first-load latency is ~30-60s for the first request.
#   - Upgrade to "Standard" to keep the service warm 24/7.
# Note about DDSP size:
#   - The first build pulls ~250 MB of TF + Magenta weights into the
#     Docker image. Subsequent builds are fast due to layer caching.
